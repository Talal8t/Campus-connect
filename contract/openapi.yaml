openapi: 3.1.0
info:
  title: CampusConnect API
  version: 2.0.0
  description: |
    SINGLE SOURCE OF TRUTH for the mobile app <-> ASP.NET Core API boundary.
    Baseline: .NET 10 / EF Core 10 / SQL Server, hosted on AWS. See /CONTRACT.md for change rules.

    Conventions
    - Base path `/api`. Wire values are PascalCase enums (`Student`, `InProgress`).
    - Errors are RFC 7807 `application/problem+json`. Validation failures are 400.
    - Lists: `{ items, pageNumber, pageSize, totalCount }`.
    - IDs: users = GUID string; lookup tables (department, category) = int32; complaints = int64.
    - Authorization is enforced server-side. Out-of-scope access returns 403, never data.

    Delivery gates (see docs/ARCHITECTURE.md): operations tagged `P0` are mandatory,
    `Session` = refresh-token flow, `G1`..`G4` are optional features that may return 501
    until enabled. The mobile client must feature-detect via `GET /api/features`.
servers:
  - url: http://localhost:5080
    description: Local (dotnet run)
  - url: https://api.campusconnect.example.com
    description: Production on AWS (replace after deploy)

security:
  - bearerAuth: []

tags:
  - { name: Auth, description: P0 + Session }
  - { name: Student, description: P0 }
  - { name: Department, description: P0 - DepartmentAdmin scope }
  - { name: Admin, description: P0 - SuperAdmin scope (read-only by default) }
  - { name: Meta, description: P0 }
  - { name: Optional, description: G1-G4 }

paths:
  /health:
    get:
      tags: [Meta]
      security: []
      summary: Liveness + DB reachability (load balancer / Nginx health check)
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [Healthy] }
        "503": { description: Database unreachable }

  /api/features:
    get:
      tags: [Meta]
      security: []
      summary: Which optional gates are enabled on this deployment
      responses:
        "200":
          description: Feature flags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Features" }

  /api/categories:
    get:
      tags: [Meta]
      summary: Categories with their responsible department (drives the submit form)
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------- Auth ----------------
  /api/auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Student self-registration. Admins are provisioned, never registered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Registered and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in (any role). Generic failure message; rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: Too many attempts }

  /api/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: |
        Exchange a refresh token for a new access token + a NEW refresh token (rotation).
        Re-using an already-rotated token revokes the whole token family (replay detection).
        Mobile clients keep the refresh token in secure storage and send it in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Rotated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Revoke the refresh-token family. Succeeds (204) even if the token is missing/unknown.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Signed out }

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Current user (rehydrate session on app start)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------- Student ----------------
  /api/complaints:
    post:
      tags: [Student]
      summary: Student submits a complaint. DepartmentId is derived server-side from categoryId.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateComplaintRequest" }
      responses:
        "201":
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Complaint" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "403": { $ref: "#/components/responses/Forbidden" }
    get:
      tags: [Student]
      summary: My complaints only (Student role). Newest first.
      parameters:
        - { $ref: "#/components/parameters/Status" }
        - { $ref: "#/components/parameters/PageNumber" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Paged list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplaintPage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/complaints/{id}:
    parameters:
      - { $ref: "#/components/parameters/ComplaintId" }
    get:
      tags: [Student]
      summary: My complaint detail incl. responses/remarks. 403 if it is not mine.
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplaintDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/uploads/presign:
    post:
      tags: [Student]
      summary: |
        (Optional attachments) Get a pre-signed S3 PUT URL for one image.
        Upload bytes directly to S3, then send `objectKey` in CreateComplaintRequest.attachmentKeys.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, sizeBytes]
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
      responses:
        "200":
          description: Presigned upload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PresignedUpload" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { description: Attachments disabled on this deployment }

  # ---------------- Department admin ----------------
  /api/department/complaints:
    get:
      tags: [Department]
      summary: Complaints of the caller's own department ONLY (current and past). DepartmentAdmin role.
      parameters:
        - { $ref: "#/components/parameters/Status" }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/PageNumber" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Paged list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplaintPage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/department/complaints/{id}:
    parameters:
      - { $ref: "#/components/parameters/ComplaintId" }
    get:
      tags: [Department]
      summary: Detail. 403 if the complaint belongs to another department (direct-URL protection).
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplaintDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/department/complaints/{id}/status:
    put:
      tags: [Department]
      summary: |
        Update status with optimistic concurrency. Allowed:
        Pending -> InProgress | Resolved | Rejected; InProgress -> Resolved | Rejected.
        Resolved and Rejected are terminal. Rejected requires `remark`.
        Stale `rowVersion` -> 409.
      parameters:
        - { $ref: "#/components/parameters/ComplaintId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStatusRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplaintDetail" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/department/complaints/{id}/remarks:
    post:
      tags: [Department]
      summary: Add a remark/response visible to the student without changing status.
      parameters:
        - { $ref: "#/components/parameters/ComplaintId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplaintDetail" }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/department/dashboard:
    get:
      tags: [Department]
      summary: KPI counts for the caller's own department
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------- Super admin ----------------
  /api/admin/complaints:
    get:
      tags: [Admin]
      summary: All complaints across departments. SuperAdmin role. Read-only by default.
      parameters:
        - { $ref: "#/components/parameters/Status" }
        - { name: categoryId, in: query, schema: { type: integer } }
        - { name: departmentId, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/PageNumber" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Paged list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplaintPage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/complaints/{id}:
    parameters:
      - { $ref: "#/components/parameters/ComplaintId" }
    get:
      tags: [Admin]
      summary: Any complaint's detail (SuperAdmin)
      responses:
        "200":
          description: Detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplaintDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/dashboard:
    get:
      tags: [Admin]
      summary: System-wide KPI counts
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/reports/by-department:
    get:
      tags: [Admin]
      summary: Bar chart - complaints received per department
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepartmentCount" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/reports/by-status:
    get:
      tags: [Admin]
      summary: Donut chart - complaints per status
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusCount" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/reports/recurring:
    get:
      tags: [Admin]
      summary: Most frequent issue categories (recurring problems), top 10
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CategoryCount" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------- Optional gates ----------------
  /api/complaints/{id}/history:
    get:
      tags: [Optional]
      summary: "G1 - Audit timeline (status changes and remarks). Same scope rules as detail."
      parameters:
        - { $ref: "#/components/parameters/ComplaintId" }
      responses:
        "200":
          description: Timeline, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/HistoryEntry" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { description: Gate disabled }

  /api/notifications:
    get:
      tags: [Optional]
      summary: "G2 - Persisted notifications for the caller. Mobile polls every 30s (SignalR is a later option)."
      parameters:
        - { $ref: "#/components/parameters/PageNumber" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Paged notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "501": { description: Gate disabled }

  /api/notifications/read-all:
    post:
      tags: [Optional]
      summary: G2 - Mark all read
      responses:
        "204": { description: Done }
        "501": { description: Gate disabled }

  /api/complaints/{id}/feedback:
    post:
      tags: [Optional]
      summary: "G3 - Owner rates a Resolved complaint 1-5, once."
      parameters:
        - { $ref: "#/components/parameters/ComplaintId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        "201": { description: Saved }
        "400": { $ref: "#/components/responses/ValidationProblem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "501": { description: Gate disabled }

  /api/admin/complaints/export:
    get:
      tags: [Optional]
      summary: "G4 - CSV export of the caller's scope (SuperAdmin: all; DepartmentAdmin: own department via same filters)"
      responses:
        "200":
          description: CSV
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { description: Gate disabled }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token, 900 s lifetime. Claims include `sub` (user GUID), `role`, and `dept` (department int id, DepartmentAdmin only).

  parameters:
    ComplaintId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Status:
      name: status
      in: query
      schema: { $ref: "#/components/schemas/ComplaintStatus" }
    Search:
      name: q
      in: query
      description: Text search over ticket, title and description
      schema: { type: string, maxLength: 100 }
    PageNumber:
      name: pageNumber
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    ValidationProblem:
      description: Invalid input (RFC 7807 with `errors`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblemDetails" }
    Unauthorized:
      description: Missing/invalid/expired credentials
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: Authenticated but outside role/department/ownership scope
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: Resource does not exist
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Conflict:
      description: Duplicate, invalid status transition, or stale rowVersion
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }

  schemas:
    ProblemDetails:
      type: object
      required: [status, title]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
        code:
          type: string
          description: Stable machine-readable reason for client branching
          enum: [InvalidCredentials, TokenExpired, RefreshReused, OutOfScope, InvalidTransition, StaleRowVersion, DuplicateEmail, GateDisabled]

    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }

    Role:
      type: string
      enum: [Student, DepartmentAdmin, SuperAdmin]

    ComplaintStatus:
      type: string
      enum: [Pending, InProgress, Resolved, Rejected]

    Features:
      type: object
      required: [history, notifications, feedback, export, attachments]
      properties:
        history: { type: boolean }
        notifications: { type: boolean }
        feedback: { type: boolean }
        export: { type: boolean }
        attachments: { type: boolean }

    Department:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string, example: Library Administration }

    Category:
      type: object
      required: [id, name, description, issueExamples, department]
      properties:
        id: { type: integer }
        name: { type: string, example: Laboratories & IT Facilities }
        description: { type: string }
        issueExamples:
          type: array
          description: Example issues from the problem statement, shown as hints on the submit form
          items: { type: string }
        department: { $ref: "#/components/schemas/Department" }

    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        studentId: { type: [string, "null"] }
        department:
          oneOf: [{ $ref: "#/components/schemas/Department" }, { type: "null" }]
          description: Set for DepartmentAdmin

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        email: { type: string, format: email, maxLength: 256 }
        password: { type: string, minLength: 8, maxLength: 100 }
        studentId: { type: string, maxLength: 30 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }

    AuthResponse:
      type: object
      required: [accessToken, expiresIn, refreshToken, user]
      properties:
        accessToken: { type: string, description: "JWT, kept in memory only" }
        expiresIn: { type: integer, example: 900, description: Seconds }
        refreshToken: { type: string, description: "Opaque, single-use, 7d sliding / 30d family cap; stored hashed server-side. Keep in secure storage." }
        user: { $ref: "#/components/schemas/User" }

    PresignedUpload:
      type: object
      required: [uploadUrl, objectKey, expiresIn]
      properties:
        uploadUrl: { type: string, format: uri }
        objectKey: { type: string }
        expiresIn: { type: integer, example: 300 }

    CreateComplaintRequest:
      type: object
      required: [categoryId, title, description]
      properties:
        categoryId: { type: integer }
        title: { type: string, minLength: 5, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 3000 }
        location: { type: string, maxLength: 120 }
        attachmentKeys:
          type: array
          maxItems: 3
          items: { type: string }

    UpdateStatusRequest:
      type: object
      required: [status, rowVersion]
      properties:
        status: { $ref: "#/components/schemas/ComplaintStatus" }
        remark: { type: string, maxLength: 2000, description: REQUIRED when status is Rejected; optional for Resolved/InProgress }
        rowVersion: { type: string, description: "Opaque value from the last read of this complaint (base64)" }

    Attachment:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, description: Short-lived signed GET URL }

    Remark:
      type: object
      required: [id, body, authorName, createdAt]
      properties:
        id: { type: integer, format: int64 }
        body: { type: string }
        authorName: { type: string }
        createdAt: { type: string, format: date-time }

    Complaint:
      type: object
      required: [id, ticket, title, status, category, department, rowVersion, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        ticket: { type: string, example: CC-2026-000042 }
        title: { type: string }
        status: { $ref: "#/components/schemas/ComplaintStatus" }
        category: { $ref: "#/components/schemas/CategorySummary" }
        department: { $ref: "#/components/schemas/Department" }
        location: { type: [string, "null"] }
        student:
          oneOf: [{ $ref: "#/components/schemas/StudentSummary" }, { type: "null" }]
          description: Omitted/null in the student's own views
        rowVersion: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: [string, "null"], format: date-time }

    ComplaintDetail:
      allOf:
        - $ref: "#/components/schemas/Complaint"
        - type: object
          required: [description, remarks, attachments, allowedTransitions]
          properties:
            description: { type: string }
            remarks:
              type: array
              items: { $ref: "#/components/schemas/Remark" }
            attachments:
              type: array
              items: { $ref: "#/components/schemas/Attachment" }
            allowedTransitions:
              type: array
              description: Statuses the caller may move this complaint to right now (empty for students and SuperAdmin). The server still re-validates.
              items: { $ref: "#/components/schemas/ComplaintStatus" }

    CategorySummary:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    StudentSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        studentId: { type: [string, "null"] }

    ComplaintPage:
      type: object
      required: [items, pageNumber, pageSize, totalCount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Complaint" }
        pageNumber: { type: integer }
        pageSize: { type: integer }
        totalCount: { type: integer }

    DashboardSummary:
      type: object
      required: [total, pending, inProgress, resolved, rejected]
      properties:
        total: { type: integer }
        pending: { type: integer }
        inProgress: { type: integer }
        resolved: { type: integer }
        rejected: { type: integer }

    DepartmentCount:
      type: object
      required: [departmentId, departmentName, count]
      properties:
        departmentId: { type: integer }
        departmentName: { type: string }
        count: { type: integer }

    StatusCount:
      type: object
      required: [status, count]
      properties:
        status: { $ref: "#/components/schemas/ComplaintStatus" }
        count: { type: integer }

    CategoryCount:
      type: object
      required: [categoryId, categoryName, count]
      properties:
        categoryId: { type: integer }
        categoryName: { type: string }
        count: { type: integer }

    HistoryEntry:
      type: object
      required: [id, kind, createdAt]
      properties:
        id: { type: integer, format: int64 }
